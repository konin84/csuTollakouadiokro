# Blueprint Render : application web + base PostgreSQL.
# Dashboard Render > New > Blueprint > choisir ce dépôt.
services:
  - type: web
    name: csu-caisse
    runtime: python
    plan: free
    region: frankfurt
    buildCommand: ./build.sh
    startCommand: python serve.py
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "0"
      - key: DATABASE_URL
        fromDatabase:
          name: csu-caisse-db
          property: connectionString
      - key: SUPERVISEUR_MOT_DE_PASSE
        sync: false

databases:
  - name: csu-caisse-db
    plan: free
    region: frankfurt
    databaseName: fsu_caisse
